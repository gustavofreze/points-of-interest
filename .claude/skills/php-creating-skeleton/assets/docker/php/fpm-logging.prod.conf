; PHP-FPM production logging and pool sizing.
;
; Loaded after www.conf and zz-docker.conf in the alphabetical php-fpm.d include
; order, so these bare directives continue the already open [www] pool (same
; pattern as fpm-logging.dev.conf). Copied into the image by Dockerfile.prod as
; zz-prod-logging.conf.

; Capture slow requests with a PHP backtrace to stderr, so the container log
; surfaces the exact call causing a bottleneck.
request_slowlog_timeout = 2s
slowlog = /proc/self/fd/2

; Surface worker stdout and stderr (warnings, notices, uncaught output) in the
; container log instead of discarding them.
catch_workers_output = yes
decorate_workers_output = no

; Pool sizing. The image default pm.max_children = 5 caps the service at five
; concurrent PHP workers, which queues requests under production concurrency.
; Size for a container with a few hundred MB of PHP memory headroom.
pm = dynamic
pm.max_children = 40
pm.start_servers = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 12
pm.max_requests = 500
