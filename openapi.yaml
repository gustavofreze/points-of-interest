openapi: 3.1.0
info:
  title: Points Of Interest API
  version: 1.0.0
  description: >-
    Registers points of interest reported by a GPS receiver and lists them back, either in full or narrowed to the
    points sitting within a maximum distance of a reference point. A point carries a name and the coordinates it sits
    at on the plane, both measured in metres from the origin and never negative. Every registration is published as a
    fact for consumers outside this domain.
servers:
  - url: /
    description: Relative to the host the service is published on.
tags:
  - name: Points of interest
  - name: Health
paths:
  /points-of-interest:
    post:
      operationId: registerPointOfInterest
      tags:
        - Points of interest
      summary: Register a point of interest
      description: Records a point of interest at the coordinates a GPS receiver reported for it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PointOfInterestRequest'
      responses:
        '201':
          description: Indicates that the point of interest was recorded and its identifier was assigned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PointOfInterestCreated'
        '409':
          description: Indicates that this name is already registered at these coordinates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: POINT_OF_INTEREST_ALREADY_EXISTS
                message: A point of interest with this name already exists at these coordinates.
        '422':
          description: Indicates that one or more of the provided values are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidRequest:
                  value:
                    code: INVALID_REQUEST
                    message: '`.point` must be present'
                coordinateNotAnInteger:
                  value:
                    code: INVALID_REQUEST
                    message: '`.point.x_coordinate` must be an integer'
                coordinateOutOfRange:
                  value:
                    code: COORDINATE_OUT_OF_RANGE
                    message: Coordinate is out of range. Current <-1>, Minimum <0>, Maximum <4294967295>.
                emptyName:
                  value:
                    code: INVALID_NAME
                    message: Name cannot be empty.
                nameTooLong:
                  value:
                    code: INVALID_NAME
                    message: Name is too long. Current <256> characters, Maximum <255> characters.
        '500':
          description: Indicates that an unexpected error occurred on the server while processing the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INTERNAL_ERROR
                message: An unexpected error occurred.
    get:
      operationId: findPointsOfInterest
      tags:
        - Points of interest
      summary: Find points of interest
      description: >-
        Lists the points of interest recorded by the service, most recently registered first. The distance,
        x_coordinate, and y_coordinate parameters travel together and narrow the page to the points sitting within
        that straight line distance of the reference point, comparing as less than or equal. The proximity survives
        the cursor, so every page of a walk stays inside the same circle.
      parameters:
        - name: sort
          in: query
          required: false
          description: Deterministic ordering of the page.
          schema:
            type: string
            default: '-created_at,-id'
            example: '-created_at,-id'
        - name: filter
          in: query
          required: false
          description: Filter over the point of interest fields.
          schema:
            type: string
            example: name==Pub
        - name: distance
          in: query
          required: false
          description: Maximum straight line distance from the reference point, in metres.
          schema:
            type: integer
            minimum: 0
            example: 10
        - name: x_coordinate
          in: query
          required: false
          description: X coordinate of the reference point the search is centered on.
          schema:
            type: integer
            minimum: 0
            example: 20
        - name: y_coordinate
          in: query
          required: false
          description: Y coordinate of the reference point the search is centered on.
          schema:
            type: integer
            minimum: 0
            example: 10
        - name: 'page[size]'
          in: query
          required: false
          description: Items per page.
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
            example: 20
        - name: 'page[cursor]'
          in: query
          required: false
          description: Opaque forward-only cursor carried by links.next of the previous response.
          schema:
            type: string
            example: 'WyIyMDI2LTA5LTIxVDEwOjAwOjAwLjAwMDAwMCswMDowMCIsIjAxYTBjNWJjLWI1OTMtNzFmZC05OGNjLTMyZDRjNTVkYmFiZCJd'
      responses:
        '200':
          description: Indicates that the points of interest page was recovered.
          headers:
            Link:
              description: RFC 8288 navigation carrying the same targets as the links object of the body.
              schema:
                type: string
              example: '</points-of-interest?page[size]=1>; rel="self", </points-of-interest?page[cursor]=WyIyMDI2LTA5LTIxVDEwOjAwOjAwLjAwMDAwMCswMDowMCIsIjAxYTBjNWJjLWI1OTMtNzFmZC05OGNjLTMyZDRjNTVkYmFiZCJd&page[size]=1>; rel="next"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PointOfInterestPage'
        '422':
          description: Indicates that a query parameter failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                partialProximity:
                  value:
                    code: INVALID_REQUEST
                    message: A proximity search takes distance, x_coordinate, and y_coordinate together.
                proximityNotAnInteger:
                  value:
                    code: INVALID_REQUEST
                    message: The <distance> must be a non-negative integer.
                sortFieldNotAllowed:
                  value:
                    code: INVALID_REQUEST
                    message: Sort field <unknown> is not allowed.
                filterFieldNotAllowed:
                  value:
                    code: INVALID_REQUEST
                    message: Filter field <created_at> is not allowed.
                pageSizeOutOfRange:
                  value:
                    code: INVALID_REQUEST
                    message: Page size <9999> must be less than or equal to 100.
                cursorIsInvalid:
                  value:
                    code: INVALID_REQUEST
                    message: Cursor token <broken> is invalid and could not be decoded.
        '500':
          description: Indicates that an unexpected error occurred on the server while processing the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INTERNAL_ERROR
                message: An unexpected error occurred.
  /health/liveness:
    get:
      operationId: livenessCheck
      tags:
        - Health
      summary: Liveness check
      description: Reports that the process is running and able to answer requests.
      responses:
        '200':
          description: Indicates that the process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'
  /health/readiness:
    get:
      operationId: readinessCheck
      tags:
        - Health
      summary: Readiness check
      description: Reports that every critical dependency of the service is reachable.
      responses:
        '200':
          description: Indicates that the service is ready to handle requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
              example:
                checks:
                  - status: UP
                    critical: true
                    component: database
                    duration_in_milliseconds: 4.59
                status: HEALTHY
        '503':
          description: >-
            Indicates that a critical dependency is down, so the service cannot handle requests. The failing entry
            carries a detail describing the failure, and the aggregate status reports UNAVAILABLE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
              example:
                checks:
                  - detail: 'An exception occurred in the driver: SQLSTATE[HY000] [2002] Connection refused'
                    status: DOWN
                    critical: true
                    component: database
                    duration_in_milliseconds: 2001.37
                status: UNAVAILABLE
components:
  schemas:
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Error code in screaming snake case.
          example: POINT_OF_INTEREST_ALREADY_EXISTS
        message:
          type: string
          description: Human readable description of the failure.
          example: A point of interest with this name already exists at these coordinates.
    Point:
      type: object
      required:
        - x_coordinate
        - y_coordinate
      properties:
        x_coordinate:
          type: integer
          minimum: 0
          maximum: 4294967295
          description: X coordinate on the plane, in metres from the origin.
          example: 12
        y_coordinate:
          type: integer
          minimum: 0
          maximum: 4294967295
          description: Y coordinate on the plane, in metres from the origin.
          example: 8
    PointOfInterestRequest:
      type: object
      required:
        - name
        - point
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Name the point of interest is known by.
          example: Pub
        point:
          $ref: '#/components/schemas/Point'
    PointOfInterestCreated:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier assigned to the point of interest.
          example: 01a0c5bc-b590-7339-ae61-cfa3b061335c
    PointOfInterest:
      type: object
      required:
        - id
        - name
        - point
        - created_at
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the point of interest.
          example: 01a0c5bc-b593-71fd-98cc-32d4c55dbabd
        name:
          type: string
          description: Name the point of interest is known by.
          example: Churrascaria
        point:
          $ref: '#/components/schemas/Point'
        created_at:
          type: string
          description: Moment when the point of interest was recorded, in ISO 8601 format.
          example: '2026-09-21T10:00:00.000000+00:00'
    PageMeta:
      type: object
      required:
        - per_page
        - has_next
      properties:
        per_page:
          type: integer
          description: Number of items the page carries at most.
          example: 20
        has_next:
          type: boolean
          description: Whether a following page exists.
          example: false
    PageLinks:
      type: object
      required:
        - self
      properties:
        self:
          type: string
          description: Link to the current page.
          example: '/points-of-interest?page[size]=20'
        next:
          type: string
          description: Link to the following page, absent when no following page exists.
          example: '/points-of-interest?page[cursor]=WyIyMDI2LTA5LTIxVDEwOjAwOjAwLjAwMDAwMCswMDowMCIsIjAxYTBjNWJjLWI1OTMtNzFmZC05OGNjLTMyZDRjNTVkYmFiZCJd&page[size]=1'
    PointOfInterestPage:
      type: object
      required:
        - data
        - meta
        - links
      properties:
        data:
          type: array
          description: The points of interest the page carries.
          items:
            $ref: '#/components/schemas/PointOfInterest'
        meta:
          $ref: '#/components/schemas/PageMeta'
        links:
          $ref: '#/components/schemas/PageLinks'
    Liveness:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          description: Aggregate liveness status.
          example: UP
    HealthCheck:
      type: object
      required:
        - status
        - critical
        - component
        - duration_in_milliseconds
      properties:
        status:
          type: string
          description: Status of the checked component.
          example: UP
        critical:
          type: boolean
          description: Whether the service cannot serve traffic without this component.
          example: true
        component:
          type: string
          description: Name of the checked component.
          example: database
        duration_in_milliseconds:
          type: number
          format: double
          description: How long the check took.
          example: 4.59
        detail:
          type: string
          description: Description of the failure, present only when the check is down.
          example: 'An exception occurred in the driver: SQLSTATE[HY000] [2002] Connection refused'
    Readiness:
      type: object
      required:
        - checks
        - status
      properties:
        checks:
          type: array
          description: One entry per checked component.
          items:
            $ref: '#/components/schemas/HealthCheck'
        status:
          type: string
          description: Aggregate readiness status.
          example: HEALTHY
