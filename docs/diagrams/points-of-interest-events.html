<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Points Of Interest domain events</title>
  <!-- Drawn with the diagram-design skill, Skedli palette (white canvas variant). Export the README SVG from
       skedli-context with python3 helpers/diagram_export.py <this file>, which runs the skill's export_svg.py
       and outlines every text as a path, so the image depends on no font. -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-ink: #011f51; --color-muted: #3f4a66;
      --font-sans: 'Nunito', 'Nunito Variable', system-ui, sans-serif;
      --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    body { font-family: var(--font-sans); background: #ffffff; color: var(--color-ink); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-size: 0.8rem; font-weight: 600; color: var(--color-muted); margin-bottom: 0.25rem; }
    h1 { font-size: 1.6rem; font-weight: 700; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1200px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">points-of-interest · domain events</p>
    <h1>Points Of Interest domain events</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="points-of-interest-events-title points-of-interest-events-desc">
        <title id="points-of-interest-events-title">Points Of Interest domain events</title>
        <desc id="points-of-interest-events-desc">EventStorming view: the points-of-interest commands that raise its domain event, the aggregate that owns them, and the outbox that records them. No consumer reacts yet.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#c4cbdc" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
          <marker id="arrow-sync" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#5985ff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
          <marker id="arrow-async" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#0b5573" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
        </defs>

        <rect width="100%" height="100%" rx="12" fill="#ffffff"/>

        <!-- Context headers -->
        <text x="200" y="48" fill="#011f51" font-size="14" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif" font-weight="700">points-of-interest</text>
        <line x1="200" y1="60" x2="840" y2="60" stroke="#5985ff" stroke-width="1"/>
        <text x="864" y="48" fill="#011f51" font-size="14" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif" font-weight="700">No consumer</text>
        <line x1="864" y1="60" x2="1160" y2="60" stroke="#e8679a" stroke-width="1"/>
        <text x="40" y="88" fill="#3f4a66" font-size="11" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif" font-weight="600">Actor</text>
        <text x="200" y="88" fill="#3f4a66" font-size="11" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif" font-weight="600">Command</text>
        <text x="432" y="88" fill="#3f4a66" font-size="11" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif" font-weight="600">Aggregate</text>
        <text x="592" y="88" fill="#3f4a66" font-size="11" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif" font-weight="600">Domain event</text>
        <text x="864" y="88" fill="#3f4a66" font-size="11" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif" font-weight="600">Policy</text>
        <text x="1000" y="88" fill="#3f4a66" font-size="11" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif" font-weight="600">Command</text>

        <!-- Flow arrows, behind the cards -->
        <line x1="176" y1="136" x2="200" y2="136" stroke="#c4cbdc" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="408" y1="136" x2="432" y2="136" stroke="#c4cbdc" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="568" y1="136" x2="592" y2="136" stroke="#c4cbdc" stroke-width="1" marker-end="url(#arrow)"/>

        <!-- Cards -->
        <rect x="40" y="116" width="136" height="40" rx="10" fill="#fff8e1"/>
        <text x="56" y="140.5" fill="#011f51" font-size="12.5" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif" font-weight="700">API client</text>
        <rect x="200" y="104" width="208" height="64" rx="10" fill="#e4ecff"/>
        <text x="216" y="133.0" fill="#011f51" font-size="12.5" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif" font-weight="700">Register point</text>
        <text x="216" y="149.0" fill="#3f4a66" font-size="10.5" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif">RegisterPointOfInterest</text>
        <rect x="592" y="104" width="248" height="64" rx="10" fill="#ffeedd"/>
        <text x="608" y="133.0" fill="#011f51" font-size="12.5" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif" font-weight="700">Point registered</text>
        <text x="608" y="149.0" fill="#3f4a66" font-size="9.5" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">PointOfInterestRegistered</text>
        <text x="1012.0" y="140" fill="#3f4a66" font-size="11" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif" text-anchor="middle">Recorded in the outbox, no consumer yet</text>

        <!-- Aggregates, merged across consecutive rows -->
        <rect x="432" y="104" width="136" height="64" rx="10" fill="#fff4cc"/>
        <text x="448" y="140.5" fill="#011f51" font-size="12.5" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif" font-weight="700">Point of interest</text>

        <!-- Transport caption -->
        <text x="600.0" y="196" fill="#3f4a66" font-size="10.5" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif" text-anchor="middle">Written to outbox_events in the same transaction as the aggregate, no relay publishes them yet</text>

        <!-- Legend -->
        <rect x="40" y="238" width="18" height="14" rx="4" fill="#fff8e1"/>
        <rect x="40" y="238" width="18" height="14" rx="4" fill="none" stroke="#e8b923" stroke-width="1"/>
        <text x="64" y="249" fill="#3f4a66" font-size="10.5" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif">Actor</text>
        <rect x="119" y="238" width="18" height="14" rx="4" fill="#e4ecff"/>
        <rect x="119" y="238" width="18" height="14" rx="4" fill="none" stroke="#5985ff" stroke-width="1"/>
        <text x="143" y="249" fill="#3f4a66" font-size="10.5" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif">Command</text>
        <rect x="208" y="238" width="18" height="14" rx="4" fill="#fff4cc"/>
        <rect x="208" y="238" width="18" height="14" rx="4" fill="none" stroke="#e8b923" stroke-width="1"/>
        <text x="232" y="249" fill="#3f4a66" font-size="10.5" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif">Aggregate</text>
        <rect x="308" y="238" width="18" height="14" rx="4" fill="#ffeedd"/>
        <rect x="308" y="238" width="18" height="14" rx="4" fill="none" stroke="#f08c3a" stroke-width="1"/>
        <text x="332" y="249" fill="#3f4a66" font-size="10.5" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif">Domain event</text>
        <rect x="424" y="238" width="18" height="14" rx="4" fill="#efeaff"/>
        <rect x="424" y="238" width="18" height="14" rx="4" fill="none" stroke="#8f7cf0" stroke-width="1"/>
        <text x="448" y="249" fill="#3f4a66" font-size="10.5" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif">Policy</text>
        <rect x="508" y="238" width="18" height="14" rx="4" fill="#ffe8f1"/>
        <rect x="508" y="238" width="18" height="14" rx="4" fill="none" stroke="#e8679a" stroke-width="1"/>
        <text x="532" y="249" fill="#3f4a66" font-size="10.5" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif">External system</text>
        <line x1="641" y1="245" x2="665" y2="245" stroke="#0b5573" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-async)"/>
        <text x="673" y="249" fill="#3f4a66" font-size="10.5" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif">Event delivery, once a relay publishes the outbox</text>
      </svg>
    </div>
  </div>
</body>
</html>
